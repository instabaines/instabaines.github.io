<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI Summer of Code 2025 session cover</title>
  <desc id="desc">A vertical cover illustration for a dual-topic session on machine learning regression and building large language models from scratch.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f2e8" />
      <stop offset="55%" stop-color="#efe6d7" />
      <stop offset="100%" stop-color="#d9ece9" />
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="leftPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf3" />
      <stop offset="100%" stop-color="#f3e1ca" />
    </linearGradient>
    <linearGradient id="rightPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6fbfb" />
      <stop offset="100%" stop-color="#dceceb" />
    </linearGradient>
  </defs>

  <rect width="900" height="1200" rx="40" fill="url(#bg)" />
  <circle cx="720" cy="170" r="130" fill="#9a3412" opacity="0.08" />
  <circle cx="180" cy="1040" r="170" fill="#0f766e" opacity="0.08" />

  <rect x="72" y="72" width="756" height="1056" rx="30" fill="#fffdf9" opacity="0.92" />

  <text x="450" y="150" text-anchor="middle" fill="#7c2d12" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">AI SUMMER OF CODE 2025</text>

  <rect x="120" y="226" width="250" height="714" rx="28" fill="url(#leftPanel)" />
  <rect x="530" y="226" width="250" height="714" rx="28" fill="url(#rightPanel)" />
  <rect x="390" y="184" width="120" height="798" rx="30" fill="url(#core)" />

  <text x="150" y="292" fill="#9a3412" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TOPIC 1</text>
  <text x="150" y="346" fill="#1f1c17" font-family="Georgia, serif" font-size="38" font-weight="700">Machine Learning</text>
  <text x="150" y="392" fill="#1f1c17" font-family="Georgia, serif" font-size="38" font-weight="700">Regression</text>

  <line x1="160" y1="790" x2="332" y2="648" stroke="#9a3412" stroke-width="6" stroke-linecap="round" opacity="0.92" />
  <circle cx="176" cy="770" r="10" fill="#0f766e" />
  <circle cx="214" cy="736" r="10" fill="#9a3412" opacity="0.65" />
  <circle cx="246" cy="722" r="10" fill="#0f766e" />
  <circle cx="282" cy="686" r="10" fill="#9a3412" opacity="0.65" />
  <circle cx="320" cy="658" r="10" fill="#0f766e" />

  <text x="560" y="292" fill="#0f766e" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TOPIC 2</text>
  <text x="560" y="342" fill="#1f1c17" font-family="Georgia, serif" font-size="34" font-weight="700">Building LLMs</text>
  <text x="560" y="384" fill="#1f1c17" font-family="Georgia, serif" font-size="34" font-weight="700">From Scratch</text>

  <g transform="translate(580 690)">
    <circle cx="0" cy="0" r="10" fill="#0f766e" />
    <circle cx="70" cy="-52" r="10" fill="#9a3412" />
    <circle cx="132" cy="16" r="10" fill="#0f766e" />
    <circle cx="52" cy="102" r="10" fill="#9a3412" />
    <circle cx="146" cy="104" r="10" fill="#0f766e" />
    <line x1="0" y1="0" x2="70" y2="-52" stroke="#1f1c17" stroke-width="5" opacity="0.78" />
    <line x1="70" y1="-52" x2="132" y2="16" stroke="#1f1c17" stroke-width="5" opacity="0.78" />
    <line x1="0" y1="0" x2="52" y2="102" stroke="#1f1c17" stroke-width="5" opacity="0.78" />
    <line x1="52" y1="102" x2="146" y2="104" stroke="#1f1c17" stroke-width="5" opacity="0.78" />
    <line x1="132" y1="16" x2="146" y2="104" stroke="#1f1c17" stroke-width="5" opacity="0.78" />
  </g>

  <text x="450" y="532" text-anchor="middle" fill="#1f1c17" font-family="Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="5">AI</text>
  <text x="450" y="592" text-anchor="middle" fill="#1f1c17" font-family="Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="5">SUMMER</text>
  <text x="450" y="652" text-anchor="middle" fill="#1f1c17" font-family="Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="5">OF CODE</text>
</svg>
